<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Larder</title>
<meta name="description" content="A private calorie, weight and waist tracker with a built-in UK food database." />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#F3F5EF" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#12150F" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Larder" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="favicon.svg" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" />

<style>
  /* ---------- Design tokens ---------- */
  :root {
    --bg: #F3F5EF;
    --surface: #FFFFFF;
    --surface-2: #FAFBF7;
    --border: #E3E6DC;
    --border-strong: #D3D7CA;
    --text: #1D231E;
    --muted: #5F675E;
    --faint: #929A8F;

    --accent: #EC6A2B;          /* energy / calories */
    --accent-ink: #B4400F;
    --accent-soft: #FCEBE0;

    --good: #1E9B57;
    --good-ink: #157345;
    --good-soft: #E6F4EA;

    --over: #D9483B;
    --over-ink: #B02F26;
    --over-soft: #FBE8E6;

    --teal: #12879A;            /* body measurements */
    --teal-ink: #0C6675;
    --teal-soft: #E1F0F2;

    --track: #ECEEE7;
    --shadow: 0 1px 2px rgba(23,30,22,.04), 0 8px 24px -12px rgba(23,30,22,.14);
    --shadow-lg: 0 12px 40px -12px rgba(23,30,22,.28);
    --radius: 16px;
    --radius-sm: 10px;
    --maxw: 1080px;

    --font-display: "Bricolage Grotesque", "Hanken Grotesk", system-ui, sans-serif;
    --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12150F;
      --surface: #1A1E17;
      --surface-2: #20251D;
      --border: #2B3128;
      --border-strong: #3A4235;
      --text: #E9ECE4;
      --muted: #9BA394;
      --faint: #6D766A;

      --accent: #F5854D;
      --accent-ink: #F7A67A;
      --accent-soft: #33231A;

      --good: #46C07C;
      --good-ink: #6FD199;
      --good-soft: #16281D;

      --over: #F0685B;
      --over-ink: #F59185;
      --over-soft: #2E1A18;

      --teal: #37B6C7;
      --teal-ink: #6BD0DC;
      --teal-soft: #10262A;

      --track: #262C22;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
      --shadow-lg: 0 16px 48px -14px rgba(0,0,0,.7);
    }
  }

  :root[data-theme="dark"] {
    --bg: #12150F;
    --surface: #1A1E17;
    --surface-2: #20251D;
    --border: #2B3128;
    --border-strong: #3A4235;
    --text: #E9ECE4;
    --muted: #9BA394;
    --faint: #6D766A;

    --accent: #F5854D;
    --accent-ink: #F7A67A;
    --accent-soft: #33231A;

    --good: #46C07C;
    --good-ink: #6FD199;
    --good-soft: #16281D;

    --over: #F0685B;
    --over-ink: #F59185;
    --over-soft: #2E1A18;

    --teal: #37B6C7;
    --teal-ink: #6BD0DC;
    --teal-soft: #10262A;

    --track: #262C22;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
    --shadow-lg: 0 16px 48px -14px rgba(0,0,0,.7);
  }

  /* ---------- Base ---------- */
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  h1,h2,h3,h4 { font-family: var(--font-display); font-weight: 700; margin: 0; line-height: 1.15; text-wrap: balance; letter-spacing: -0.01em; }
  button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  input, select { font-family: inherit; font-size: 15px; color: var(--text); }
  .tnum { font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  /* ---------- Layout ---------- */
  .app { max-width: var(--maxw); margin: 0 auto; padding: 0 18px 120px; }

  .topbar {
    position: sticky; top: 0; z-index: 40;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding-top: env(safe-area-inset-top);
  }
  .topbar-inner { max-width: var(--maxw); margin: 0 auto; padding: 12px max(18px, env(safe-area-inset-right)) 12px max(18px, env(safe-area-inset-left)); display: flex; align-items: center; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(150deg, var(--accent), color-mix(in srgb, var(--accent) 62%, #d33));
    color: #fff; font-size: 19px; box-shadow: var(--shadow);
  }
  .brand-name { font-family: var(--font-display); font-weight: 800; font-size: 21px; letter-spacing: -0.02em; }
  .brand-sub { font-size: 11.5px; color: var(--faint); letter-spacing: .04em; text-transform: uppercase; margin-top: -3px; }
  .icon-btn {
    display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
    transition: .15s; padding: 0;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--border-strong); }
  .sync-dot { position: absolute; right: 4px; bottom: 4px; width: 9px; height: 9px; border-radius: 50%; background: var(--faint); border: 2px solid var(--surface); transition: background .2s; }

  .tabs { display: flex; gap: 4px; padding: 10px 0 2px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    border: none; background: transparent; color: var(--muted); font-weight: 600; font-size: 15px;
    padding: 9px 15px; border-radius: 999px; white-space: nowrap; transition: .15s;
  }
  .tab:hover { color: var(--text); background: var(--surface-2); }
  .tab[aria-selected="true"] { background: var(--text); color: var(--bg); }

  /* ---------- Cards ---------- */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .grid { display: grid; gap: 16px; }
  section { margin-top: 20px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 2px 12px; }
  .section-head h2 { font-size: 20px; }
  .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--faint); font-weight: 600; }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
    font-weight: 600; font-size: 14px; padding: 9px 14px; border-radius: 10px; transition: .15s;
  }
  .btn:hover { border-color: var(--faint); background: var(--surface-2); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); border-color: transparent; }
  .btn-ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--text); }
  .btn-sm { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
  .btn-block { width: 100%; }

  .chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600;
    padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted);
    border: 1px solid var(--border);
  }

  /* ---------- Inputs ---------- */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12.5px; font-weight: 600; color: var(--muted); letter-spacing: .01em; }
  .input, select.input {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border-strong);
    background: var(--surface-2); color: var(--text); transition: .15s; -webkit-appearance: none; appearance: none;
    font-size: 16px; /* >=16px stops iOS Safari zooming in on focus */
  }
  .input:focus { border-color: var(--accent); background: var(--surface); }
  select.input { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%235F675E' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>"); background-repeat: no-repeat; background-position: right 12px center; padding-right: 34px; }
  .input-row { display: flex; gap: 10px; }

  /* ---------- Today: ring + summary ---------- */
  .day-nav { display: flex; align-items: center; gap: 10px; }
  .day-nav .date-label { font-family: var(--font-display); font-weight: 700; font-size: 18px; min-width: 210px; text-align: center; }
  .today-grid { display: grid; grid-template-columns: minmax(0,320px) 1fr; gap: 16px; align-items: stretch; }
  .ring-card { padding: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .ring-wrap { position: relative; width: 210px; height: 210px; }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-eaten { font-family: var(--font-display); font-weight: 800; font-size: 46px; line-height: 1; letter-spacing: -0.02em; }
  .ring-unit { font-size: 12px; color: var(--faint); text-transform: uppercase; letter-spacing: .1em; margin-top: 4px; }
  .ring-status { margin-top: 14px; font-weight: 600; font-size: 14.5px; }
  .ring-legend { display: flex; gap: 16px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
  .ring-legend div { font-size: 13px; color: var(--muted); }
  .ring-legend b { display: block; font-family: var(--font-display); font-size: 18px; color: var(--text); font-weight: 700; }

  .meals { display: flex; flex-direction: column; gap: 12px; }
  .meal { padding: 4px 4px 8px; }
  .meal-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px; }
  .meal-emoji { font-size: 17px; }
  .meal-name { font-weight: 700; font-family: var(--font-display); font-size: 16px; }
  .meal-kcal { margin-left: auto; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .entry { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-top: 1px solid var(--border); }
  .entry:first-of-type { border-top: 1px solid var(--border); }
  .entry-main { min-width: 0; }
  .entry-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry-detail { font-size: 12.5px; color: var(--faint); }
  .entry-kcal { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .entry-del { border: none; background: transparent; color: var(--faint); font-size: 16px; padding: 4px 6px; border-radius: 8px; line-height: 1; }
  .entry-del:hover { color: var(--over); background: var(--over-soft); }
  .meal-add { margin: 8px 14px 4px; }
  .meal-empty { padding: 4px 14px 10px; color: var(--faint); font-size: 13.5px; }

  /* ---------- Body metrics card ---------- */
  .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .metric-big { font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: -0.02em; }
  .metric-label { font-size: 12.5px; color: var(--muted); }
  .delta { font-size: 12.5px; font-weight: 700; }
  .delta.down { color: var(--good-ink); }
  .delta.up { color: var(--over-ink); }
  .delta.flat { color: var(--faint); }

  /* ---------- Progress ---------- */
  .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .stat-card { padding: 16px; }
  .stat-card .k { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .stat-card .v { font-family: var(--font-display); font-weight: 800; font-size: 27px; margin-top: 6px; letter-spacing: -0.02em; }
  .stat-card .sub { font-size: 12.5px; margin-top: 2px; color: var(--faint); }
  .chart-card { padding: 18px; }
  .chart-card h3 { font-size: 16px; margin-bottom: 2px; }
  .chart-card .cap { color: var(--faint); font-size: 13px; margin-bottom: 12px; }
  .chart { width: 100%; height: auto; display: block; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { border: none; background: transparent; color: var(--muted); font-weight: 600; font-size: 13px; padding: 6px 12px; border-radius: 7px; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

  .hbar-row { display: grid; grid-template-columns: 130px 1fr auto; align-items: center; gap: 12px; padding: 7px 0; }
  .hbar-track { height: 10px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .hbar-fill { height: 100%; border-radius: 999px; }
  .hbar-label { font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbar-val { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 13.5px; }

  .food-rank { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--border); }
  .food-rank:first-child { border-top: none; }
  .rank-n { width: 24px; height: 24px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--border); display: grid; place-items: center; font-weight: 700; font-size: 12.5px; color: var(--muted); }

  /* ---------- Foods tab ---------- */
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .search { position: relative; flex: 1; min-width: 220px; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); }
  .search input { padding-left: 38px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); }
  td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
  tr:last-child td { border-bottom: none; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .food-name { font-weight: 600; }
  .cat-chip { font-size: 11.5px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }

  /* ---------- Modal ---------- */
  .overlay { position: fixed; inset: 0; z-index: 60; background: rgba(15,18,13,.5); backdrop-filter: blur(3px); display: flex; align-items: flex-end; justify-content: center; padding: 0; }
  @media (min-width: 640px) { .overlay { align-items: center; padding: 24px; } }
  .modal { background: var(--surface); border: 1px solid var(--border); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; border-radius: 20px 20px 0 0; box-shadow: var(--shadow-lg); }
  @media (min-width: 640px) { .modal { border-radius: 20px; } }
  .modal-head { position: sticky; top: 0; background: var(--surface); display: flex; align-items: center; gap: 12px; padding: 18px 20px 12px; border-bottom: 1px solid var(--border); z-index: 2; }
  .modal-head h3 { font-size: 18px; margin-right: auto; }
  .modal-body { padding: 18px 20px 22px; }
  .modal-foot { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 14px 20px; display: flex; gap: 10px; }

  .result { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 11px 12px; border-radius: 12px; border: 1px solid transparent; background: transparent; }
  .result:hover { background: var(--surface-2); border-color: var(--border); }
  .result.sel { border-color: var(--accent); background: var(--accent-soft); }
  .result-main { min-width: 0; }
  .result-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result-meta { font-size: 12.5px; color: var(--faint); }
  .result-kcal { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
  .results { display: flex; flex-direction: column; gap: 2px; max-height: 320px; overflow-y: auto; margin: 0 -6px; }

  .meal-picker { display: flex; gap: 6px; flex-wrap: wrap; }
  .meal-pick { border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: 13px; padding: 7px 12px; border-radius: 999px; }
  .meal-pick[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }

  .kcal-preview { display: flex; align-items: baseline; gap: 8px; padding: 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; }
  .kcal-preview .big { font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: -.02em; }

  .empty { text-align: center; padding: 40px 20px; color: var(--faint); }
  .empty .big { font-size: 30px; margin-bottom: 8px; }

  .hint { font-size: 12.5px; color: var(--faint); }
  .divider { height: 1px; background: var(--border); margin: 18px 0; border: none; }
  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: .25s; z-index: 80; max-width: calc(100vw - 32px); text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Mobile-only chrome: hidden on desktop, shown in the media query below */
  .bottomnav { display: none; }
  .fab { display: none; }

  @media (max-width: 760px) {
    .today-grid { grid-template-columns: 1fr; }
    .summary-grid { grid-template-columns: 1fr 1fr; }
    .two-col { grid-template-columns: 1fr; }
    .day-nav .date-label { min-width: 118px; font-size: 16px; }

    /* Page gutters follow the safe area; leave room for the bottom nav */
    .app { padding: 0 max(16px, env(safe-area-inset-left)) calc(80px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-right)); }

    /* Swap the desktop top tabs for a thumb-friendly bottom bar */
    .tabbar-row { display: none; }
    .bottomnav {
      display: grid; grid-template-columns: repeat(3, 1fr);
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
      background: color-mix(in srgb, var(--surface) 90%, transparent);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .navbtn {
      border: none; background: transparent; color: var(--faint);
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 9px 0 7px; font-size: 11px; font-weight: 600;
    }
    .navbtn svg { width: 23px; height: 23px; }
    .navbtn[aria-selected="true"] { color: var(--accent); }
    .navbtn:active { transform: scale(.93); }

    .fab {
      display: grid; place-items: center;
      position: fixed; right: 16px; z-index: 46;
      bottom: calc(72px + env(safe-area-inset-bottom));
      width: 56px; height: 56px; border-radius: 18px;
      background: var(--accent); color: #fff; border: none;
      box-shadow: 0 12px 26px -8px color-mix(in srgb, var(--accent) 65%, transparent), var(--shadow-lg);
    }
    .fab:active { transform: scale(.93); }

    /* Larger touch targets (Apple HIG ~44px) */
    .btn { min-height: 44px; }
    .btn-sm { min-height: 40px; }
    .icon-btn { width: 42px; height: 42px; }
    .entry-del { padding: 8px 10px; font-size: 18px; }
    .meal-add { min-height: 42px; }
    .result { padding: 13px 12px; }
    .food-rank { padding: 12px 0; }

    /* Keep toast clear of the bottom bar */
    .toast { bottom: calc(86px + env(safe-area-inset-bottom)); }

    /* Modals dock to the bottom and respect the home indicator */
    .modal { max-height: 90vh; }
    .modal-foot { padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">

/* =========================================================================

   ========================================================================= */
const STORE_KEY = "larder.v1";
const DEFAULT_STATE = {
  settings: { goal: 2000, weightUnit: "kg", waistUnit: "cm", theme: "system", calc: null },
  log: [],        // {id, date, meal, name, kcal, grams, detail, foodId}
  weights: [],    // {id, date, kg}
  waists: [],     // {id, date, cm}
  customFoods: [],// same shape as FOODS entries, plus custom:true
  savedMeals: []  // {id, name, kcal, items:[{name,kcal,grams,detail,foodId,meal}]}
};

let state = loadState();

/* Coerce any parsed object into a valid, fully-populated state shape. */
function normalizeState(parsed) {
  parsed = parsed || {};
  return {
    settings: Object.assign({}, DEFAULT_STATE.settings, parsed.settings || {}),
    log: Array.isArray(parsed.log) ? parsed.log : [],
    weights: Array.isArray(parsed.weights) ? parsed.weights : [],
    waists: Array.isArray(parsed.waists) ? parsed.waists : [],
    customFoods: Array.isArray(parsed.customFoods) ? parsed.customFoods : [],
    savedMeals: Array.isArray(parsed.savedMeals) ? parsed.savedMeals : [],
  };
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return structuredClone(DEFAULT_STATE);
    return normalizeState(JSON.parse(raw));
  } catch (e) {
    return structuredClone(DEFAULT_STATE);
  }
}
function saveLocal() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch (e) { toast("Couldn't save — storage may be full"); }
}
/* save() persists locally and (when signed in) schedules a cloud sync. */
function save() {
  saveLocal();
  scheduleCloudPush();
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* All available foods (built-in + custom) */
function allFoods() { return state.customFoods.concat(FOODS); }

/* =========================================================================
   DATE HELPERS  (local time, YYYY-MM-DD keys)
   ========================================================================= */
function toKey(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function fromKey(k) { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); }
function todayKey() { return toKey(new Date()); }
function addDaysKey(k, n) { const d = fromKey(k); d.setDate(d.getDate() + n); return toKey(d); }
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function niceDate(k) {
  const d = fromKey(k);
  return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`;
}
function shortDate(k) { const d = fromKey(k); return `${d.getDate()} ${MON[d.getMonth()]}`; }

/* =========================================================================
   UNIT CONVERSION (store metric: kg & cm)
   ========================================================================= */
const KG_PER_LB = 0.45359237;
function kgToNum(kg, unit) {
  if (unit === "lb") return kg / KG_PER_LB;
  if (unit === "st") return kg / KG_PER_LB / 14;
  return kg;
}
function weightDisplay(kg, unit) {
  if (kg == null) return "—";
  if (unit === "lb") return (kg / KG_PER_LB).toFixed(1) + " lb";
  if (unit === "st") {
    const totalLb = kg / KG_PER_LB;
    let st = Math.floor(totalLb / 14);
    let lb = totalLb - st * 14;
    if (lb >= 13.95) { st += 1; lb = 0; }
    return `${st} st ${lb.toFixed(1)} lb`;
  }
  return kg.toFixed(1) + " kg";
}
function weightUnitLabel(unit) { return unit === "lb" ? "lb" : unit === "st" ? "st" : "kg"; }
/* Convert user-entered weight fields to kg, given the active unit. Returns 0 if blank/invalid. */
function parseWeightToKg(unit, mainVal, stVal, lbVal) {
  if (unit === "st") {
    const st = parseFloat(stVal) || 0, lb = parseFloat(lbVal) || 0;
    return (st * 14 + lb) * KG_PER_LB;
  }
  const v = parseFloat(mainVal) || 0;
  return unit === "lb" ? v * KG_PER_LB : v;
}
function cmToNum(cm, unit) { return unit === "in" ? cm / 2.54 : cm; }
function waistDisplay(cm, unit) {
  if (cm == null) return "—";
  return unit === "in" ? (cm / 2.54).toFixed(1) + " in" : cm.toFixed(1) + " cm";
}

function dayTotal(dateKey) { return entriesFor(dateKey).reduce((s, e) => s + e.kcal, 0); }
function latest(arr, field) {
  if (!arr.length) return null;
  const sorted = arr.slice().sort((a, b) => a.date < b.date ? 1 : -1);
  return sorted[0];
}

  else if (view.tab === "foods") renderFoods();

      ? `<span style="color:var(--good-ink)">${fmt(remaining)} kcal left</span>`

  app.innerHTML = `
    <section>
      <div class="row-between" style="margin:18px 2px 16px;">
        <div class="day-nav">
          <button class="icon-btn" data-action="day-prev" aria-label="Previous day">

function weightInputHTML() {
  const u = state.settings.weightUnit;
  if (u === "st") {
    return `<div class="input-row">
      <input class="input tnum" id="weight-st" inputmode="numeric" placeholder="st" style="flex:1" />
      <input class="input tnum" id="weight-lb" inputmode="decimal" placeholder="lb" style="flex:1" />
      <button class="btn" data-action="save-weight">Save</button>
    </div>`;
  }
  return `<div class="input-row">
    <input class="input tnum" id="weight-main" inputmode="decimal" placeholder="${u === 'lb' ? 'e.g. 176' : 'e.g. 80.5'}" />
    <button class="btn" data-action="save-weight">Save</button>
  </div>`;
}
function fillWeightInputs(kg) {
  const u = state.settings.weightUnit;
  if (u === "st") {
    const totalLb = kg / KG_PER_LB;
    const st = Math.floor(totalLb / 14);
    const lb = totalLb - st * 14;
    const stEl = document.getElementById("weight-st"), lbEl = document.getElementById("weight-lb");
    if (stEl) stEl.value = st;
    if (lbEl) lbEl.value = round(lb, 1);
  } else {
    const el = document.getElementById("weight-main");
    if (el) el.value = round(kgToNum(kg, u), 1);
  }
}

/* Ring SVG */
function ringSVG(pct, color) {
  const size = 210, sw = 18, r = (size - sw) / 2, c = 2 * Math.PI * r;
  const shown = Math.max(0, Math.min(1, pct));
  const dash = c * shown;
  const eaten = fmt(dayTotal(view.date));
  return `
    <div class="ring-wrap">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"/>
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
          stroke-linecap="round" stroke-dasharray="${dash} ${c}" style="transition:stroke-dasharray .5s ease"/>
      </svg>
      <div class="ring-center">
        <div class="ring-eaten tnum">${eaten}</div>
        <div class="ring-unit">kcal eaten</div>
      </div>
    </div>`;
}

function statCard(k, v, sub, tone) {

  return `<div class="card stat-card">
    <div class="k">${k}</div>

    <div class="sub">${sub}</div>
  </div>`;
}

/* Calorie bar chart with goal line */
function calorieBars(days, goal) {
  const mob = window.innerWidth <= 760;
  const W = mob ? 384 : 720, H = mob ? 232 : 240, padL = 40, padR = 12, padT = 14, padB = 26;
  const fA = mob ? 13 : 11, fX = mob ? 12 : 10.5;
  const vals = days.map(dayTotal);
  const maxV = Math.max(goal * 1.15, ...vals, 100);
  const niceMax = Math.ceil(maxV / 250) * 250;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const bw = plotW / days.length;
  const y = v => padT + plotH - (v / niceMax) * plotH;

  const grid = [];
  const steps = 4;
  for (let i = 0; i <= steps; i++) {
    const gv = (niceMax / steps) * i;
    const gy = y(gv);
    grid.push(`<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="var(--border)" stroke-width="1"/>`);
    grid.push(`<text x="${padL-8}" y="${gy+4}" text-anchor="end" font-size="${fA}" fill="var(--faint)">${gv>=1000?(gv/1000)+"k":gv}</text>`);
  }

  const bars = days.map((d, i) => {
    const v = vals[i];
    if (v <= 0) return "";
    const x = padL + i * bw + bw * 0.16;
    const w = bw * 0.68;
    const yy = y(v), h = padT + plotH - yy;
    const over = v > goal;
    const col = over ? "var(--over)" : "var(--accent)";
    return `<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1,h).toFixed(1)}" rx="3" fill="${col}"><title>${niceDate(d)}: ${fmt(v)} kcal</title></rect>`;
  }).join("");

  // x labels: show a handful
  const labelEvery = days.length <= 10 ? 1 : days.length <= 32 ? 5 : 15;
  const xlabels = days.map((d, i) => {
    if (i % labelEvery !== 0 && i !== days.length - 1) return "";
    const x = padL + i * bw + bw / 2;
    return `<text x="${x.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="${fX}" fill="var(--faint)">${shortDate(d)}</text>`;
  }).join("");

  const gy = y(goal);
  const goalLine = `<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="var(--good-ink)" stroke-width="1.5" stroke-dasharray="5 4"/>`;

  const hasData = vals.some(v => v > 0);
  if (!hasData) return emptyChart("Log some food to see this chart");

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily calorie intake bar chart">
    ${grid.join("")}${bars}${goalLine}${xlabels}
  </svg>`;
}

/* Generic line/trend chart for weight & waist */
function trendChart(points, color, unit) {
  if (points.length === 0) return emptyChart("No measurements logged yet");
  if (points.length === 1) {
    return `<div style="padding:26px 6px;text-align:center;">
      <div class="metric-big tnum" style="color:${color}">${round(points[0].value,1)} <span style="font-size:16px;color:var(--faint)">${unit}</span></div>
      <div class="hint" style="margin-top:6px;">Log another day to see a trend line</div>
    </div>`;
  }
  const W = 340, H = 190, padL = 40, padR = 14, padT = 14, padB = 24;
  const fA = window.innerWidth <= 760 ? 12 : 11;
  const vals = points.map(p => p.value);
  let min = Math.min(...vals), max = Math.max(...vals);
  const span = (max - min) || 1;
  min -= span * 0.15; max += span * 0.15;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const n = points.length;
  const x = i => padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
  const y = v => padT + plotH - ((v - min) / (max - min)) * plotH;

  const grid = [];
  for (let i = 0; i <= 3; i++) {
    const gv = min + ((max - min) / 3) * i;
    const gy = y(gv);
    grid.push(`<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="var(--border)" stroke-width="1"/>`);
    grid.push(`<text x="${padL-7}" y="${gy+4}" text-anchor="end" font-size="${fA}" fill="var(--faint)">${round(gv,1)}</text>`);
  }
  const linePts = points.map((p, i) => `${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(" ");
  const areaPts = `${padL},${padT+plotH} ${linePts} ${x(n-1).toFixed(1)},${padT+plotH}`;
  const dots = points.map((p, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="${i===n-1?4:2.6}" fill="${color}" stroke="var(--surface)" stroke-width="1.5"><title>${niceDate(p.date)}: ${round(p.value,1)} ${unit}</title></circle>`).join("");

  const xlabels = [0, n - 1].map(i => `<text x="${x(i).toFixed(1)}" y="${H-7}" text-anchor="${i===0?"start":"end"}" font-size="${fA}" fill="var(--faint)">${shortDate(points[i].date)}</text>`).join("");

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend chart">
    <defs><linearGradient id="grad-${color.replace(/[^a-z]/gi,'')}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity="0.22"/>
      <stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid.join("")}
    <polygon points="${areaPts}" fill="url(#grad-${color.replace(/[^a-z]/gi,'')})"/>
    <polyline points="${linePts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${xlabels}
  </svg>`;
}

function mealRoutine(loggedDays) {
  if (!loggedDays.length) return emptyChart("No food logged in this range");
  const byMeal = {};
  MEALS.forEach(m => byMeal[m.id] = 0);
  loggedDays.forEach(d => entriesFor(d).forEach(e => { byMeal[e.meal] = (byMeal[e.meal]||0) + e.kcal; }));
  const nDays = loggedDays.length;
  const rows = MEALS.map(m => ({ name: m.name, emoji: m.emoji, val: Math.round(byMeal[m.id] / nDays) }));
  const max = Math.max(1, ...rows.map(r => r.val));
  return rows.map(r => `
    <div class="hbar-row">
      <div class="hbar-label">${r.emoji} ${r.name}</div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${(r.val/max*100).toFixed(0)}%;background:var(--accent)"></div></div>
      <div class="hbar-val tnum">${fmt(r.val)}</div>
    </div>`).join("");
}

function dowRoutine(days) {
  const sums = Array(7).fill(0), counts = Array(7).fill(0);
  days.forEach(d => {
    if (entriesFor(d).length === 0) return;
    const idx = fromKey(d).getDay();
    sums[idx] += dayTotal(d); counts[idx]++;
  });
  const order = [1,2,3,4,5,6,0]; // Mon..Sun
  const rows = order.map(i => ({ name: DOW[i], val: counts[i] ? Math.round(sums[i]/counts[i]) : 0 }));
  const anyData = rows.some(r => r.val > 0);
  if (!anyData) return emptyChart("Not enough data yet");
  const max = Math.max(1, ...rows.map(r => r.val));
  return rows.map(r => `
    <div class="hbar-row">
      <div class="hbar-label">${r.name}</div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${(r.val/max*100).toFixed(0)}%;background:var(--teal)"></div></div>
      <div class="hbar-val tnum">${r.val ? fmt(r.val) : "—"}</div>
    </div>`).join("");
}

function topFoods(days) {
  const set = new Set(days);
  const map = new Map();
  state.log.forEach(e => {
    if (!set.has(e.date)) return;
    const key = e.name;
    const cur = map.get(key) || { name: e.name, count: 0, kcal: 0 };
    cur.count++; cur.kcal += e.kcal;
    map.set(key, cur);
  });
  const list = [...map.values()].sort((a, b) => b.count - a.count).slice(0, 8);
  if (!list.length) return emptyChart("No food logged in this range");
  return list.map((f, i) => `
    <div class="food-rank">
      <div class="rank-n">${i+1}</div>
      <div style="min-width:0;flex:1">
        <div class="food-name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(f.name)}</div>
        <div class="hint">${f.count}× logged · ${fmt(f.kcal)} kcal total</div>
      </div>
      <div class="chip tnum">${f.count}×</div>
    </div>`).join("");
}

function emptyChart(msg) {
  return `<div class="empty" style="padding:34px 12px"><div style="font-size:22px;margin-bottom:6px">📊</div><div>${msg}</div></div>`;
}

/* ---------------------------------------------- INTAKE vs BODY (comparison) */
function intakeVsBody(days, goal) {
  const wu = weightUnitLabel(state.settings.weightUnit), cu = state.settings.waistUnit;
  const setDays = new Set(days);
  const wPts = state.weights.filter(w => setDays.has(w.date)).sort((a,b)=>a.date<b.date?-1:1).map(w => ({ date: w.date, value: kgToNum(w.kg, state.settings.weightUnit) }));
  const waPts = state.waists.filter(w => setDays.has(w.date)).sort((a,b)=>a.date<b.date?-1:1).map(w => ({ date: w.date, value: cmToNum(w.cm, state.settings.waistUnit) }));

  const hasAny = days.some(d => dayTotal(d) > 0) || wPts.length || waPts.length;
  if (!hasAny) {
    return `<section>
      <div class="section-head"><h2>Intake vs. your body</h2><span class="eyebrow">last ${days.length} days</span></div>
      <div class="card chart-card">${emptyChart("Log some food and a weight or waist measurement to compare them")}</div>
    </section>`;
  }

  const legendBar = `<span style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)"><span style="width:12px;height:12px;border-radius:3px;background:var(--accent);opacity:.5"></span>Daily calories</span>`;
  const legendLine = (txt) => `<span style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)"><span style="width:15px;height:3px;border-radius:2px;background:var(--teal)"></span>${txt}</span>`;

  const weekly = buildWeekly(days);
  const showWeekly = weekly.some(w => w.avgKcal != null || w.wDelta != null || w.waDelta != null);
  const insight = intakeInsight(days, goal, wPts, waPts, wu, cu);

  return `
    <section>
      <div class="section-head"><h2>Intake vs. your body</h2><span class="eyebrow">last ${days.length} days</span></div>
      ${insight ? `<div class="card" style="padding:15px 17px;margin-bottom:16px"><p style="margin:0;color:var(--muted);line-height:1.55">${insight}</p></div>` : ""}
      <div class="two-col">
        <div class="card chart-card">
          <h3>Calories vs weight</h3>
          <div style="display:flex;gap:16px;flex-wrap:wrap;margin:4px 0 12px">${legendBar}${legendLine("Weight (" + wu + ")")}</div>
          ${overlayChart(days, wPts, wu)}
        </div>
        <div class="card chart-card">
          <h3>Calories vs waist</h3>
          <div style="display:flex;gap:16px;flex-wrap:wrap;margin:4px 0 12px">${legendBar}${legendLine("Waist (" + cu + ")")}</div>
          ${overlayChart(days, waPts, cu)}
        </div>
      </div>
      ${showWeekly ? `<div class="card chart-card" style="margin-top:16px">
        <h3>Week by week</h3>

    </section>`;
}

/* Dual-axis chart: calorie bars (left, kcal) + a measurement line (right) */
function overlayChart(days, points, unit) {
  const mob = window.innerWidth <= 760;
  const W = mob ? 384 : 560, H = mob ? 232 : 240, padL = 40, padR = 44, padT = 16, padB = 26;
  const fA = mob ? 13 : 12, fX = mob ? 12 : 11;
  const cals = days.map(dayTotal);
  const hasCals = cals.some(v => v > 0);
  if (!hasCals && points.length === 0) return emptyChart("Not enough data in this range");
  const plotW = W - padL - padR, plotH = H - padT - padB, n = days.length, bw = plotW / n;

  const calMax = Math.max(100, ...cals);
  const niceCal = Math.ceil(calMax / 250) * 250 || 250;
  const yL = v => padT + plotH - (v / niceCal) * plotH;

  let vmin = 0, vmax = 1;
  if (points.length) {
    const vals = points.map(p => p.value);
    vmin = Math.min(...vals); vmax = Math.max(...vals);
    const span = (vmax - vmin) || 1; vmin -= span * 0.25; vmax += span * 0.25;
  }
  const yR = v => padT + plotH - ((v - vmin) / (vmax - vmin)) * plotH;
  const xAt = i => padL + i * bw + bw / 2;

  let grid = "";
  for (let i = 0; i <= 4; i++) {
    const gv = (niceCal / 4) * i, gy = yL(gv);
    grid += `<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="var(--border)" stroke-width="1"/>`;
    grid += `<text x="${padL-7}" y="${gy+4}" text-anchor="end" font-size="${fA}" fill="var(--faint)">${gv>=1000?(gv/1000)+"k":gv}</text>`;
  }
  let rlabels = "";
  if (points.length) {
    for (let i = 0; i <= 2; i++) {
      const gv = vmin + ((vmax - vmin) / 2) * i, gy = yR(gv);
      rlabels += `<text x="${W-padR+7}" y="${gy+4}" text-anchor="start" font-size="${fA}" fill="var(--teal-ink)">${round(gv,1)}</text>`;
    }
  }
  let bars = "";
  days.forEach((d, i) => {
    const v = cals[i]; if (v <= 0) return;
    const x = padL + i * bw + bw * 0.2, w = bw * 0.6, yy = yL(v), h = padT + plotH - yy;
    bars += `<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1,h).toFixed(1)}" rx="2.5" fill="var(--accent)" opacity="0.3"><title>${niceDate(d)}: ${fmt(v)} kcal</title></rect>`;
  });
  let line = "", dots = "";
  if (points.length) {
    const coords = points.map(p => `${xAt(days.indexOf(p.date)).toFixed(1)},${yR(p.value).toFixed(1)}`);
    if (points.length > 1) line = `<polyline points="${coords.join(" ")}" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    dots = points.map(p => `<circle cx="${xAt(days.indexOf(p.date)).toFixed(1)}" cy="${yR(p.value).toFixed(1)}" r="3.2" fill="var(--teal)" stroke="var(--surface)" stroke-width="1.5"><title>${niceDate(p.date)}: ${round(p.value,1)} ${unit}</title></circle>`).join("");
  }
  const every = n <= 10 ? 2 : n <= 32 ? 6 : 14;
  let xl = "";
  days.forEach((d, i) => {
    if (i % every !== 0 && i !== n - 1) return;
    xl += `<text x="${xAt(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="${fX}" fill="var(--faint)">${shortDate(d)}</text>`;
  });

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily calories against ${unit} over time">${grid}${bars}${line}${dots}${rlabels}${xl}</svg>`;
}

/* Latest measurement value on/before (or strictly before) a date */
function measureAsOf(arr, dateKey, field, inclusive) {
  let best = null;
  for (const m of arr) {
    const ok = inclusive ? m.date <= dateKey : m.date < dateKey;
    if (ok && (!best || m.date > best.date)) best = m;
  }
  return best ? best[field] : null;
}

/* Bucket the range into weeks (most recent first) with avg intake + measurement deltas */
function buildWeekly(days) {
  const chron = days.slice();
  const weeks = [];
  for (let end = chron.length; end > 0; end -= 7) weeks.push(chron.slice(Math.max(0, end - 7), end));
  return weeks.map((bucket, i) => {
    const weekStart = bucket[0], weekEnd = bucket[bucket.length - 1];
    const logged = bucket.filter(d => entriesFor(d).length > 0);
    const avgKcal = logged.length ? Math.round(logged.reduce((s, d) => s + dayTotal(d), 0) / logged.length) : null;
    const wEnd = measureAsOf(state.weights, weekEnd, "kg", true), wRef = measureAsOf(state.weights, weekStart, "kg", false);
    const waEnd = measureAsOf(state.waists, weekEnd, "cm", true), waRef = measureAsOf(state.waists, weekStart, "cm", false);
    return {
      weekStart, weekEnd, isRecent: i === 0, avgKcal,
      wDelta: (wEnd != null && wRef != null) ? kgToNum(wEnd - wRef, state.settings.weightUnit) : null,
      waDelta: (waEnd != null && waRef != null) ? cmToNum(waEnd - waRef, state.settings.waistUnit) : null,
    };
  });
}

function weekLabel(startK, endK, isRecent) {
  if (isRecent) return "This week";
  const s = fromKey(startK), e = fromKey(endK);
  const sM = MON[s.getMonth()], eM = MON[e.getMonth()];
  return sM === eM ? `${s.getDate()}–${e.getDate()} ${eM}` : `${s.getDate()} ${sM} – ${e.getDate()} ${eM}`;
}
function deltaCell(v, unit) {
  if (v == null) return `<td class="num"><span class="hint">—</span></td>`;
  const r = round(v, 1);
  const col = r < 0 ? "--good-ink" : r > 0 ? "--over-ink" : "--faint";
  const disp = (r > 0 ? "+" : r < 0 ? "−" : "") + Math.abs(r);
  return `<td class="num tnum" style="color:var(${col});font-weight:600">${disp} ${unit}</td>`;
}
function weeklyTable(weeks, wu, cu) {
  const rows = weeks.map(w => `<tr>
    <td class="food-name">${weekLabel(w.weekStart, w.weekEnd, w.isRecent)}</td>
    <td class="num tnum">${w.avgKcal != null ? fmt(w.avgKcal) : '<span class="hint">—</span>'}</td>
    ${deltaCell(w.wDelta, wu)}
    ${deltaCell(w.waDelta, cu)}
  </tr>`).join("");
  return `<table><thead><tr><th>Week</th><th class="num">Avg kcal/day</th><th class="num">Weight</th><th class="num">Waist</th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* Plain-language summary tying intake to body change */
function intakeInsight(days, goal, wPts, waPts, wu, cu) {
  const logged = days.filter(d => entriesFor(d).length > 0);
  const avgCal = logged.length ? Math.round(logged.reduce((s, d) => s + dayTotal(d), 0) / logged.length) : null;
  const wNet = wPts.length >= 2 ? wPts[wPts.length - 1].value - wPts[0].value : null;
  const waNet = waPts.length >= 2 ? waPts[waPts.length - 1].value - waPts[0].value : null;
  if (avgCal == null && wNet == null && waNet == null) return "";
  const nDays = days.length;
  const arrow = v => v < 0 ? "fell" : v > 0 ? "rose" : "held steady";

  let s = "";
  if (avgCal != null) {
    const diff = avgCal - goal;
    const rel = diff <= 0 ? `<b>${fmt(-diff)} under</b>` : `<b>${fmt(diff)} over</b>`;
    s = `Over the last ${nDays} days you averaged <b>${fmt(avgCal)} kcal/day</b> — ${rel} your ${fmt(goal)} kcal goal.`;
  }
  const bits = [];
  if (wNet != null) bits.push(`weight ${arrow(wNet)}${wNet ? " <b>" + Math.abs(round(wNet,1)) + " " + wu + "</b>" : ""}`);
  if (waNet != null) bits.push(`waist ${arrow(waNet)}${waNet ? " <b>" + Math.abs(round(waNet,1)) + " " + cu + "</b>" : ""}`);
  if (bits.length) {
    const joined = bits.length === 2 ? bits[0] + " and " + bits[1] : bits[0];
    s += (s ? ` In that time your ` : `Over the last ${nDays} days your `) + joined + ".";
  }
  return s;
}

function openAddFood(meal, presetFoodId) {
  addCtx = { meal: meal || "breakfast", search: "", foodId: presetFoodId || null, servingIdx: 0, qty: 1, customAmount: "" };
  renderAddModal();
}
function foodById(id) { return allFoods().find(f => f.id === id); }

function servingOptions(food) {
  // returns array of {label, grams}
  return [
    { label: `${food.serving.label} (${food.serving.grams} ${food.unit})`, grams: food.serving.grams },
    { label: `100 ${food.unit}`, grams: 100 },
    { label: `Custom ${food.unit}…`, grams: null },
  ];
}
function computeAddKcal() {
  const f = foodById(addCtx.foodId);
  if (!f) return { kcal: 0, grams: 0, detail: "" };
  const opts = servingOptions(f);
  const opt = opts[addCtx.servingIdx];
  let grams = opt.grams;
  if (grams == null) grams = parseFloat(addCtx.customAmount) || 0;
  const qty = addCtx.qty || 1;
  const totalG = grams * qty;
  const kcal = Math.round(f.kcal * totalG / 100);
  let detail;
  if (opt.grams == null) detail = `${round(totalG,0)} ${f.unit}`;
  else detail = qty === 1 ? `${opt.label}` : `${qty} × ${opt.label}`;
  return { kcal, grams: totalG, detail };
}
