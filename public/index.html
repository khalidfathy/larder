/* =========================================================================
   GENERIC CONFIRM / PROMPT MODALS
   (native confirm()/prompt() can be blocked inside sandboxed iframes)
   ========================================================================= */
const CLOSE_SVG = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`;
let pendingConfirm = null, pendingPrompt = null;

function confirmModal({ title, body, confirmLabel = "Confirm", danger = false, onConfirm }) {
  mountModal(`
    <div class="overlay">
      <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" style="max-width:420px">
        <div class="modal-head"><h3>${esc(title)}</h3>
          <button class="icon-btn" data-action="close-modal" aria-label="Close">${CLOSE_SVG}</button></div>
        <div class="modal-body"><p style="margin:0;color:var(--muted)">${esc(body)}</p></div>
        <div class="modal-foot">
          <button class="btn btn-block" data-action="close-modal">Cancel</button>
          <button class="btn btn-block" data-action="confirm-yes" ${danger?'style="background:var(--over);border-color:var(--over);color:#fff"':'class="btn btn-primary btn-block"'}>${esc(confirmLabel)}</button>
        </div>
      </div>
    </div>`);
  pendingConfirm = onConfirm; // set AFTER mount (mountModal→unmountModal clears pending callbacks)
}

function promptModal({ title, label, placeholder = "", value = "", submitLabel = "Save", onSubmit }) {
  mountModal(`
    <div class="overlay">
      <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" style="max-width:420px">
        <div class="modal-head"><h3>${esc(title)}</h3>
          <button class="icon-btn" data-action="close-modal" aria-label="Close">${CLOSE_SVG}</button></div>
        <div class="modal-body"><div class="field"><label>${esc(label)}</label>
          <input class="input" id="prompt-input" placeholder="${esc(placeholder)}" value="${esc(value)}" autocomplete="off"/></div></div>
        <div class="modal-foot">
          <button class="btn btn-block" data-action="close-modal">Cancel</button>
          <button class="btn btn-primary btn-block" data-action="prompt-submit">${esc(submitLabel)}</button>
        </div>
      </div>
    </div>`);
  pendingPrompt = onSubmit; // set AFTER mount (mountModal→unmountModal clears pending callbacks)
  const i = document.getElementById("prompt-input"); if (i) { i.focus(); i.select(); }
}

/* =========================================================================
   COPY A DAY
   ========================================================================= */
function openCopyDay() {
  const days = [...new Set(state.log.map(e => e.date))].filter(d => d !== view.date).sort((a,b)=>a<b?1:-1).slice(0, 60);
  const yday = addDaysKey(todayKey(), -1);
  const rows = days.map(d => {
    const items = entriesFor(d);
    return `<button class="result" data-action="do-copy-day" data-date="${d}">
      <div class="result-main">
        <div class="result-name">${niceDate(d)}${d===yday?' · yesterday':''}</div>
        <div class="result-meta">${items.length} item${items.length===1?"":"s"}</div>
      </div>
      <div class="result-kcal">${fmt(items.reduce((s,e)=>s+e.kcal,0))} kcal</div>
    </button>`;
  }).join("");
  const into = view.date===todayKey() ? "today" : niceDate(view.date);
  mountModal(`
    <div class="overlay">
      <div class="modal" role="dialog" aria-modal="true" aria-label="Copy a day">
        <div class="modal-head"><h3>Copy a day into ${view.date===todayKey()?"today":shortDate(view.date)}</h3>
          <button class="icon-btn" data-action="close-modal" aria-label="Close">${CLOSE_SVG}</button></div>
        <div class="modal-body">
          ${days.length
            ? `<div class="hint" style="margin-bottom:10px">Pick a day to copy all its food into ${into}.</div><div class="results">${rows}</div>`
            : `<div class="empty"><div class="big">📋</div>No other days have food logged yet.</div>`}
        </div>
      </div>
    </div>`);
}
function doCopyDay(fromDate) {
  const items = entriesFor(fromDate);
  if (!items.length) { unmountModal(); return; }
  items.forEach(e => state.log.push(Object.assign({}, e, { id: uid(), date: view.date })));
  save(); unmountModal(); view.tab = "today"; render();
  toast(`Copied ${items.length} item${items.length===1?"":"s"} from ${shortDate(fromDate)}`);
}

/* =========================================================================
   SAVED MEALS (reusable recipes)
   ========================================================================= */
function openSavedMeals() {
  const into = view.date===todayKey() ? "today" : niceDate(view.date);
  const rows = state.savedMeals.map(m => `
    <div class="food-rank">
      <div style="min-width:0;flex:1">
        <div class="food-name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.name)}</div>
        <div class="hint">${m.items.length} item${m.items.length===1?"":"s"} · ${fmt(m.kcal)} kcal</div>
      </div>
      <button class="btn btn-sm btn-primary" data-action="add-saved" data-id="${m.id}">Add</button>
      <button class="entry-del" data-action="del-saved" data-id="${m.id}" aria-label="Delete ${esc(m.name)}">✕</button>
    </div>`).join("");
  mountModal(`
    <div class="overlay">
      <div class="modal" role="dialog" aria-modal="true" aria-label="Saved meals">
        <div class="modal-head"><h3>Saved meals</h3>
          <button class="icon-btn" data-action="close-modal" aria-label="Close">${CLOSE_SVG}</button></div>
        <div class="modal-body">
          ${state.savedMeals.length
            ? `<div class="hint" style="margin-bottom:8px">Tap <b>Add</b> to log a meal into ${into} — items return to their original meal.</div>${rows}`
            : `<div class="empty"><div class="big">🔖</div>No saved meals yet.<div class="hint" style="margin-top:8px;max-width:320px">On the Today screen, log a meal then tap the bookmark on that meal card to save it here for one-tap reuse.</div></div>`}
        </div>
      </div>
    </div>`);
}
function addSavedMeal(id) {
  const m = state.savedMeals.find(x => x.id === id);
  if (!m) return;
  m.items.forEach(it => state.log.push({ id: uid(), date: view.date, meal: it.meal || "snacks", name: it.name, kcal: it.kcal, grams: it.grams, detail: it.detail, foodId: it.foodId }));
  save(); unmountModal(); view.tab = "today"; render();
  toast(`Added “${m.name}” · ${fmt(m.kcal)} kcal`);
}
function delSavedMeal(id) {
  const m = state.savedMeals.find(x => x.id === id);
  if (!m) return;
  confirmModal({ title: "Delete saved meal", body: `Remove “${m.name}” from your saved meals?`, confirmLabel: "Delete", danger: true,
    onConfirm: () => { state.savedMeals = state.savedMeals.filter(x => x.id !== id); save(); openSavedMeals(); toast("Saved meal deleted"); } });
}
function saveMealAsRecipe(mealId) {
  const items = entriesFor(view.date).filter(e => e.meal === mealId);
  if (!items.length) { toast("Nothing to save in that meal"); return; }
  const mealName = MEALS.find(m => m.id === mealId).name;
  promptModal({
    title: "Save as meal", label: "Name this meal", placeholder: `e.g. My usual ${mealName.toLowerCase()}`, submitLabel: "Save meal",
    onSubmit: (name) => {
      name = (name || "").trim();
      if (!name) { toast("Give the meal a name"); return; }
      const kcal = items.reduce((s, e) => s + e.kcal, 0);
      state.savedMeals.unshift({ id: uid(), name, kcal, items: items.map(e => ({ name: e.name, kcal: e.kcal, grams: e.grams, detail: e.detail, foodId: e.foodId, meal: e.meal })) });
      save(); render(); toast(`Saved “${name}”`);
    }
  });
}

/* =========================================================================
   GOAL CALCULATOR (BMR / TDEE — Mifflin-St Jeor)
   ========================================================================= */
const ACTIVITY = [
  { v: 1.2,  label: "Sedentary — little or no exercise" },
  { v: 1.375, label: "Lightly active — 1–3 days/week" },
  { v: 1.55, label: "Moderately active — 3–5 days/week" },
  { v: 1.725, label: "Very active — 6–7 days/week" },
  { v: 1.9,  label: "Extra active — hard training / physical job" },
];
const TARGETS = [
  { v: 0,     label: "Maintain weight" },
  { v: -0.25, label: "Lose 0.25 kg/week (gentle)" },
  { v: -0.5,  label: "Lose 0.5 kg/week (steady)" },
  { v: -0.75, label: "Lose 0.75 kg/week (faster)" },
  { v: 0.25,  label: "Gain 0.25 kg/week" },
  { v: 0.5,   label: "Gain 0.5 kg/week" },
];

function openGoalCalc() {
  const c = state.settings.calc || {};
  const u = state.settings.weightUnit;
  const lastW = latest(state.weights);
  const seedKg = (c.weightKg != null ? c.weightKg : (lastW ? lastW.kg : null));
  const hUnit = c.heightUnit || (state.settings.waistUnit === "in" ? "ftin" : "cm");

  let weightFields;
  if (u === "st") {
    let st = "", lb = "";
    if (seedKg != null) { const t = seedKg / KG_PER_LB; st = Math.floor(t / 14); lb = round(t - st * 14, 1); }
    weightFields = `<div class="input-row"><input class="input tnum" id="gc-wst" inputmode="numeric" placeholder="st" value="${st}"/><input class="input tnum" id="gc-wlb" inputmode="decimal" placeholder="lb" value="${lb}"/></div>`;
  } else {
    const val = seedKg != null ? round(kgToNum(seedKg, u), 1) : "";
    weightFields = `<input class="input tnum" id="gc-wmain" inputmode="decimal" placeholder="${u==='lb'?'e.g. 176':'e.g. 80.5'}" value="${val}"/>`;
  }

  let heightFields;
  if (hUnit === "ftin") {
    let ft = "", inch = "";
    if (c.heightCm) { const ti = c.heightCm / 2.54; ft = Math.floor(ti / 12); inch = round(ti - ft * 12, 0); }
    heightFields = `<div class="input-row"><input class="input tnum" id="gc-hft" inputmode="numeric" placeholder="ft" value="${ft}"/><input class="input tnum" id="gc-hin" inputmode="decimal" placeholder="in" value="${inch}"/></div>`;
  } else {
    heightFields = `<input class="input tnum" id="gc-hcm" inputmode="decimal" placeholder="e.g. 175" value="${c.heightCm||""}"/>`;
  }

  mountModal(`
    <div class="overlay">
      <div class="modal" role="dialog" aria-modal="true" aria-label="Goal calculator">
        <div class="modal-head"><h3>Work out my daily goal</h3>
          <button class="icon-btn" data-action="close-modal" aria-label="Close">${CLOSE_SVG}</button></div>
        <div class="modal-body">
          <div class="hint" style="margin-bottom:14px">Estimates your maintenance calories (Mifflin-St Jeor) and suggests a daily goal for your target.</div>
          <div class="input-row" style="margin-bottom:12px">
            <div class="field" style="flex:1"><label>Sex</label>
              <select class="input" id="gc-sex"><option value="female" ${c.sex!=="male"?"selected":""}>Female</option><option value="male" ${c.sex==="male"?"selected":""}>Male</option></select></div>
            <div class="field" style="flex:1"><label>Age</label><input class="input tnum" id="gc-age" inputmode="numeric" placeholder="years" value="${c.age||""}"/></div>
          </div>
          <div class="input-row" style="margin-bottom:12px">
            <div class="field" style="flex:1"><label>Height</label>${heightFields}</div>
            <div class="field" style="width:92px;flex:none"><label>Units</label>
              <select class="input" id="gc-hunit"><option value="cm" ${hUnit==="cm"?"selected":""}>cm</option><option value="ftin" ${hUnit==="ftin"?"selected":""}>ft/in</option></select></div>
          </div>
          <div class="field" style="margin-bottom:12px"><label>Weight (${weightUnitLabel(u)})</label>${weightFields}</div>
          <div class="field" style="margin-bottom:12px"><label>Activity level</label>
            <select class="input" id="gc-activity">${ACTIVITY.map(a=>`<option value="${a.v}" ${Math.abs((+c.activity||1.375)-a.v)<1e-6?"selected":""}>${a.label}</option>`).join("")}</select></div>
          <div class="field" style="margin-bottom:4px"><label>Goal</label>
            <select class="input" id="gc-target">${TARGETS.map(t=>`<option value="${t.v}" ${Math.abs((c.target!=null?+c.target:-0.5)-t.v)<1e-6?"selected":""}>${t.label}</option>`).join("")}</select></div>
          <div id="gc-result" style="margin-top:14px"></div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-block" data-action="close-modal">Cancel</button>
          <button class="btn btn-primary btn-block" data-action="gc-calc">Calculate</button>
        </div>
      </div>
    </div>`);
  const hunitEl = document.getElementById("gc-hunit");
  if (hunitEl) hunitEl.addEventListener("change", () => { persistCalcInputs(); openGoalCalc(); });
}

function persistCalcInputs() {
  const g = id => (document.getElementById(id) || {}).value;
  const prev = state.settings.calc || {};
  const u = state.settings.weightUnit;
  const weightKg = parseWeightToKg(u, g("gc-wmain"), g("gc-wst"), g("gc-wlb")) || prev.weightKg || null;
  // read height from whichever fields are actually rendered
  let heightCm;
  if (document.getElementById("gc-hcm")) {
    heightCm = parseFloat(g("gc-hcm")) || prev.heightCm || null;
  } else {
    const ft = parseFloat(g("gc-hft")) || 0, inch = parseFloat(g("gc-hin")) || 0;
    heightCm = (ft || inch) ? round((ft * 12 + inch) * 2.54, 1) : (prev.heightCm || null);
  }
  const targetRaw = g("gc-target");
  state.settings.calc = {
    sex: g("gc-sex") || "female",
    age: parseFloat(g("gc-age")) || prev.age || null,
    heightCm,
    heightUnit: g("gc-hunit") || prev.heightUnit || "cm",
    weightKg: weightKg || null,
    activity: parseFloat(g("gc-activity")) || 1.375,
    target: targetRaw !== "" && targetRaw != null ? parseFloat(targetRaw) : -0.5,
  };
}

function calcGoal() {
  persistCalcInputs();
  const c = state.settings.calc;
  const res = document.getElementById("gc-result");
  if (!res) return;
  if (!c.age || c.age <= 0 || !c.heightCm || c.heightCm <= 0 || !c.weightKg || c.weightKg <= 0) {
    res.innerHTML = `<div class="kcal-preview" style="border-color:var(--over)"><span style="color:var(--over-ink);font-weight:600">Enter your age, height and weight to calculate.</span></div>`;
    return;
  }
  const bmr = 10 * c.weightKg + 6.25 * c.heightCm - 5 * c.age + (c.sex === "male" ? 5 : -161);
  const tdee = bmr * (c.activity || 1.375);
  let goal = tdee + (c.target || 0) * 1100;
  const floor = c.sex === "male" ? 1500 : 1200;
  let note = "";
  if (goal < floor) { goal = floor; note = `Capped at a safe minimum of ${fmt(floor)} kcal — consider a gentler target.`; }
  goal = Math.round(goal / 10) * 10;
  const maint = Math.round(tdee / 10) * 10;
  res.innerHTML = `
    <div class="kcal-preview" style="flex-direction:column;align-items:stretch;gap:9px">
      <div class="row-between"><span style="color:var(--muted)">Maintenance (TDEE)</span><b class="tnum">${fmt(maint)} kcal</b></div>
      <div class="row-between"><span style="color:var(--muted)">Suggested daily goal</span><b class="tnum" style="font-family:var(--font-display);font-size:22px;color:var(--accent-ink)">${fmt(goal)}</b></div>
      ${note ? `<div class="hint">${note}</div>` : ""}
      <button class="btn btn-primary btn-block" data-action="gc-use" data-goal="${goal}" style="margin-top:2px">Use ${fmt(goal)} kcal as my goal</button>
    </div>`;
  save();
}
function useCalcGoal(goal) {
  if (goal > 0) state.settings.goal = goal;
  save(); unmountModal(); view.tab = "today"; render();
  toast(`Daily goal set to ${fmt(goal)} kcal`);
}

/* =========================================================================
   MODAL PLUMBING
   ========================================================================= */
let modalRoot = null;
function mountModal(html) {
  unmountModal();
  modalRoot = document.createElement("div");
  modalRoot.innerHTML = html;
  document.body.appendChild(modalRoot);
  document.body.style.overflow = "hidden";
}
function unmountModal() {
  if (modalRoot) { modalRoot.remove(); modalRoot = null; document.body.style.overflow = ""; }
  pendingConfirm = null; pendingPrompt = null;
}

/* =========================================================================
   HELPERS
   ========================================================================= */
function fmt(n) { return Math.round(n).toLocaleString("en-GB"); }
function round(n, d) { const f = Math.pow(10, d); return Math.round(n * f) / f; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

/* =========================================================================
   THEME
   ========================================================================= */
function applyTheme() {
  const t = state.settings.theme;
  if (t === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}
function toggleTheme() {
  const cur = state.settings.theme;
  // system -> opposite of what's showing; simplest: cycle system -> light -> dark -> system
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  let next;
  if (cur === "system") next = prefersDark ? "light" : "dark";
  else if (cur === "light") next = prefersDark ? "system" : "dark";
  else next = prefersDark ? "light" : "system";
  state.settings.theme = next;
  applyTheme(); save();
  toast(next === "system" ? "Following system theme" : next === "dark" ? "Dark mode" : "Light mode");
}

/* =========================================================================
   EVENT HANDLING
   ========================================================================= */
document.addEventListener("click", (ev) => {
  // Backdrop click closes the modal (only when the overlay itself is the target)
  if (ev.target.classList.contains("overlay")) { unmountModal(); return; }
  const el = ev.target.closest("[data-action],[data-tab]");
  if (!el) return;
  if (el.dataset.tab) { view.tab = el.dataset.tab; window.scrollTo(0, 0); render(); return; }
  const action = el.dataset.action;

  switch (action) {
    case "theme": toggleTheme(); break;
    case "settings": openSettings(); break;

    case "day-prev": view.date = addDaysKey(view.date, -1); render(); break;
    case "day-next": if (view.date < todayKey()) { view.date = addDaysKey(view.date, 1); render(); } break;
    case "day-today": view.date = todayKey(); render(); break;

    case "range": view.range = Number(el.dataset.range); render(); break;

    case "add-food": openAddFood(el.dataset.meal); break;
    case "add-custom": openCustomFood(); break;
    case "log-food": openAddFood("breakfast", el.dataset.id); break;

    case "del-entry": {
      const id = el.dataset.id;
      state.log = state.log.filter(e => e.id !== id);
      save(); render();
      break;
    }

    case "save-weight": saveWeight(); break;
    case "save-waist": saveWaist(); break;

    // modal: add food
    case "close-modal": unmountModal(); break;
    case "pick-meal": addCtx.meal = el.dataset.meal; renderAddModal(); break;
    case "select-food": addCtx.foodId = el.dataset.id; addCtx.servingIdx = 0; addCtx.qty = 1; addCtx.customAmount = ""; renderAddModal(); break;
    case "clear-food": addCtx.foodId = null; renderAddModal(); break;
    case "confirm-add": confirmAddFood(); break;
    case "quick-add": quickAdd(); break;

    // custom food
    case "save-custom": saveCustomFood(); break;

    // settings
    case "save-settings": saveSettings(); break;
    case "export": exportData(); break;
    case "import": importData(); break;
    case "clear": clearData(); break;

    // copy day + saved meals
    case "copy-day": openCopyDay(); break;
    case "do-copy-day": doCopyDay(el.dataset.date); break;
    case "saved-meals": openSavedMeals(); break;
    case "add-saved": addSavedMeal(el.dataset.id); break;
    case "del-saved": delSavedMeal(el.dataset.id); break;
    case "save-meal": saveMealAsRecipe(el.dataset.meal); break;

    // goal calculator
    case "goal-calc": openGoalCalc(); break;
    case "gc-calc": calcGoal(); break;
    case "gc-use": useCalcGoal(Number(el.dataset.goal)); break;

    // generic confirm / prompt
    case "confirm-yes": { const fn = pendingConfirm; unmountModal(); if (fn) fn(); break; }
    case "prompt-submit": { const v = (document.getElementById("prompt-input")||{}).value; const fn = pendingPrompt; unmountModal(); if (fn) fn(v); break; }

    // account & cloud sync
    case "account": openAuth(); break;
    case "auth-signin": doAuth("signin"); break;
    case "auth-signup": doAuth("signup"); break;
    case "auth-signout": doSignOut(); break;
    case "sync-now": syncNow(); break;
  }
});

/* Keep results list live while typing in the add-food search (no full rebuild) */
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.id === "add-search") { addCtx.search = t.value; refreshAddResults(); }
  else if (t.id === "food-search") { view.foodSearch = t.value; updateFoodsTable(); }
  else if (t.id === "qty-in") { addCtx.qty = Math.max(0, parseFloat(t.value) || 0); updateKcalPreview(); }
  else if (t.id === "custom-amt") { addCtx.customAmount = t.value; updateKcalPreview(); }
});
document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.id === "serving-sel") { addCtx.servingIdx = Number(t.value); renderAddModal(); }
  else if (t.id === "food-cat") { view.foodCat = t.value; renderFoods(); }
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && modalRoot) { unmountModal(); return; }
  if (ev.key === "Enter" && document.activeElement) {
    const id = document.activeElement.id;
    if (id === "prompt-input") {
      ev.preventDefault();
      const v = document.activeElement.value; const fn = pendingPrompt; unmountModal(); if (fn) fn(v);
    } else if (id === "auth-email" || id === "auth-pass") {
      ev.preventDefault(); doAuth("signin");
    }
  }
});

/* Live-filter the foods table without losing search focus */
function updateFoodsTable() {
  const q = view.foodSearch.trim().toLowerCase();
  let list = allFoods();
  if (view.foodCat !== "all") list = list.filter(f => f.cat === view.foodCat);
  if (q) list = list.filter(f => f.name.toLowerCase().includes(q) || f.cat.toLowerCase().includes(q));
  list = list.slice().sort((a, b) => a.name.localeCompare(b.name));
  const tbody = document.querySelector("tbody");
  if (tbody) tbody.innerHTML = list.length ? list.map(foodRow).join("") : `<tr><td colspan="6"><div class="empty">No foods match “${esc(view.foodSearch)}”</div></td></tr>`;
}

/* =========================================================================
   ACTIONS
   ========================================================================= */
function confirmAddFood() {
  const f = foodById(addCtx.foodId);
  if (!f) { toast("Pick a food first"); return; }
  const calc = computeAddKcal();
  if (calc.kcal <= 0) { toast("Enter an amount"); return; }
  state.log.push({
    id: uid(), date: view.date, meal: addCtx.meal,
    name: f.name, kcal: calc.kcal, grams: calc.grams, detail: calc.detail, foodId: f.id
  });
  save(); unmountModal();
  view.tab = "today"; render();
  toast(`Added ${f.name} · ${fmt(calc.kcal)} kcal`);
}

function quickAdd() {
  const name = (document.getElementById("quick-name").value || "").trim();
  const kcal = Math.round(parseFloat(document.getElementById("quick-kcal").value) || 0);
  if (!name) { toast("Give it a name"); return; }
  if (kcal <= 0) { toast("Enter the calories"); return; }
  state.log.push({ id: uid(), date: view.date, meal: addCtx.meal, name, kcal, detail: "quick add" });
  save(); unmountModal();
  view.tab = "today"; render();
  toast(`Added ${name} · ${fmt(kcal)} kcal`);
}

function saveCustomFood() {
  const name = (document.getElementById("cf-name").value || "").trim();
  const kcal = Math.round(parseFloat(document.getElementById("cf-kcal").value) || 0);
  const unit = document.getElementById("cf-unit").value;
  const cat = document.getElementById("cf-cat").value;
  const sname = (document.getElementById("cf-sname").value || "1 portion").trim();
  const sgrams = Math.round(parseFloat(document.getElementById("cf-sgrams").value) || 0);
  if (!name) { toast("Give the food a name"); return; }
  if (kcal <= 0) { toast("Enter calories per 100"); return; }
  const id = "c_" + slug(name) + "_" + uid().slice(-3);
  state.customFoods.unshift({ id, name, cat, kcal, unit, serving: { label: sname, grams: sgrams || 100 }, custom: true });
  save(); unmountModal(); renderFoods();
  toast(`Saved ${name} to your foods`);
}

function saveWeight() {
  const u = state.settings.weightUnit;
  const kg = parseWeightToKg(u,
    (document.getElementById("weight-main")||{}).value,
    (document.getElementById("weight-st")||{}).value,
    (document.getElementById("weight-lb")||{}).value);
  if (kg <= 0) { toast("Enter your weight"); return; }
  upsertMeasure(state.weights, view.date, "kg", round(kg, 2));
  save(); render();
  toast("Weight saved");
}
function saveWaist() {
  const u = state.settings.waistUnit;
  const v = parseFloat((document.getElementById("waist-in")||{}).value) || 0;
  if (v <= 0) { toast("Enter your waist measurement"); return; }
  const cm = u === "in" ? v * 2.54 : v;
  upsertMeasure(state.waists, view.date, "cm", round(cm, 1));
  save(); render();
  toast("Waist saved");
}
function upsertMeasure(arr, date, field, value) {
  const existing = arr.find(x => x.date === date);
  if (existing) existing[field] = value;
  else arr.push({ id: uid(), date, [field]: value });
}

function saveSettings() {
  const goal = Math.round(parseFloat(document.getElementById("set-goal").value) || 0);
  if (goal > 0) state.settings.goal = goal;
  state.settings.weightUnit = document.getElementById("set-wunit").value;
  state.settings.waistUnit = document.getElementById("set-waunit").value;
  save(); unmountModal(); render();
  toast("Settings saved");
}

async function exportData() {
  const json = JSON.stringify(state, null, 2);
  const filename = `larder-backup-${todayKey()}.json`;

  // Hosted-artifact path: use the downloads capability (sandbox blocks direct downloads)
  let downloads = null;
  try { downloads = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null; }
  catch (e) { downloads = null; }
  if (downloads) {
    try { await downloads.save({ filename, data: json }); toast("Backup saved"); }
    catch (err) { if (!(err && err.code === "declined")) toast("Couldn't save backup"); }
    return;
  }

  // Standalone/local file path: direct blob download
  try {
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast("Backup downloaded");
  } catch (e) { toast("Export isn't supported here"); }
}
function importData() {
  const input = document.createElement("input");
  input.type = "file"; input.accept = "application/json,.json";
  input.onchange = () => {
    const file = input.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        state = normalizeState(JSON.parse(reader.result));
        save(); applyTheme(); unmountModal(); render();
        toast("Backup restored");
      } catch (e) { toast("That file couldn't be read"); }
    };
    reader.readAsText(file);
  };
  input.click();
}
function clearData() {
  confirmModal({
    title: "Clear all data",
    body: "Delete all logged food, weights, measurements and saved meals? This can't be undone.",
    confirmLabel: "Delete everything", danger: true,
    onConfirm: () => {
      state = structuredClone(DEFAULT_STATE);
      save(); applyTheme(); view.date = todayKey(); view.tab = "today"; render();
      toast("All data cleared");
    }
  });
}

/* =========================================================================
   CLOUD SYNC (Supabase) — optional; active only when config.js is filled in
   ========================================================================= */
const CFG = (window.LARDER_CONFIG || {});
let sb = null;
try {
  if (CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase && window.supabase.createClient) {
    sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
  }
} catch (e) { sb = null; }

let authUser = null;
let syncStatus = "offline";     // offline | synced | saving | error
let cloudPushTimer = null;
let localBackedUp = false;

function cloudEnabled() { return !!sb; }

async function initAuth() {
  if (!sb) { updateSyncUI(); return; }
  try {
    const { data } = await sb.auth.getSession();
    authUser = (data && data.session) ? data.session.user : null;
  } catch (e) { authUser = null; }
  updateSyncUI();
  if (authUser) await pullCloud(true);

  sb.auth.onAuthStateChange((_event, session) => {
    authUser = session ? session.user : null;
    updateSyncUI();
  });
  // Returning to the app pulls the latest (e.g. edits made on another device)
  document.addEventListener("visibilitychange", () => { if (!document.hidden) pullCloud(false); });
  window.addEventListener("focus", () => pullCloud(false));
}

async function pullCloud(isInitial) {
  if (!sb || !authUser) return;
  try {
    const { data, error } = await sb.from("app_state").select("data").eq("user_id", authUser.id).maybeSingle();
    if (error) { console.warn("sync pull:", error.message); setSync("error"); return; }
    if (data && data.data && typeof data.data === "object") {
      // First time we adopt cloud data on this device, stash whatever was local
      if (isInitial && !localBackedUp) {
        try { const cur = localStorage.getItem(STORE_KEY); if (cur) localStorage.setItem(STORE_KEY + ".pre-sync-backup", cur); } catch (e) {}
        localBackedUp = true;
      }
      const incoming = normalizeState(data.data);
      if (JSON.stringify(incoming) !== JSON.stringify(state)) {
        state = incoming;
        saveLocal();
        applyTheme();
        if (!modalRoot) render();
      }
      setSync("synced");
    } else if (isInitial) {
      await pushCloud(); // no cloud row yet → seed it from this device
    }
  } catch (e) { console.warn(e); setSync("error"); }
}

function scheduleCloudPush() {
  if (!sb || !authUser) return;
  setSync("saving");
  clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(pushCloud, 1000);
}

async function pushCloud() {
  if (!sb || !authUser) return;
  clearTimeout(cloudPushTimer);
  try {
    const { error } = await sb.from("app_state").upsert(
      { user_id: authUser.id, data: state, updated_at: new Date().toISOString() },
      { onConflict: "user_id" }
    );
    if (error) { console.warn("sync push:", error.message); setSync("error"); return; }
    setSync("synced");
  } catch (e) { console.warn(e); setSync("error"); }
}

function setSync(s) { syncStatus = s; updateSyncUI(); }

function updateSyncUI() {
  const btn = document.getElementById("account-btn");
  if (btn) {
    if (!cloudEnabled()) { btn.style.display = "none"; }
    else {
      btn.style.display = "";
      const dot = btn.querySelector(".sync-dot");
      let color = "var(--faint)";
      if (authUser) {
        color = syncStatus === "error" ? "var(--over)" : syncStatus === "saving" ? "var(--accent)" : "var(--good)";
      }
      if (dot) dot.style.background = color;
      btn.title = syncLabel();
    }
  }
  const info = document.getElementById("account-status");
  if (info) info.textContent = syncLabel();
}
function syncLabel() {
  if (!cloudEnabled()) return "Local only";
  if (!authUser) return "Sign in to sync across devices";
  if (syncStatus === "saving") return "Saving…";
  if (syncStatus === "error") return "Sync error — check your connection";
  return "Synced · " + (authUser.email || "signed in");
}

/* ---- Auth UI ---- */
function openAuth() {
  if (!sb) { toast("Cloud sync isn't set up yet"); return; }
  if (authUser) {
    mountModal(`
      <div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="Account and sync" style="max-width:440px">
        <div class="modal-head"><h3>Account &amp; sync</h3><button class="icon-btn" data-action="close-modal" aria-label="Close">${CLOSE_SVG}</button></div>
        <div class="modal-body">
          <div class="kcal-preview" style="flex-direction:column;align-items:stretch;gap:6px">
            <div class="row-between"><span style="color:var(--muted)">Signed in as</span><b style="overflow:hidden;text-overflow:ellipsis">${esc(authUser.email || "—")}</b></div>
            <div id="account-status" class="hint"></div>
          </div>
          <p class="hint" style="margin:14px 2px 4px">Your food, weights, measurements and settings sync automatically to every device where you sign in with this account.</p>
          <div class="input-row" style="flex-wrap:wrap;margin-top:12px">
            <button class="btn" data-action="sync-now">Sync now</button>
            <button class="btn" data-action="auth-signout" style="color:var(--over-ink);border-color:var(--over-soft)">Sign out</button>
          </div>
        </div>
      </div></div>`);
    updateSyncUI();
    return;
  }
  mountModal(`
    <div class="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="Sign in" style="max-width:440px">
      <div class="modal-head"><h3>Sync across devices</h3><button class="icon-btn" data-action="close-modal" aria-label="Close">${CLOSE_SVG}</button></div>
      <div class="modal-body">
        <p class="hint" style="margin:0 2px 16px">Sign in to store your data securely and use it on your phone and computer. New here? Enter any email and a password and tap <b>Create account</b>.</p>
        <div class="field" style="margin-bottom:12px"><label>Email</label>
          <input class="input" id="auth-email" type="email" inputmode="email" autocomplete="username" placeholder="you@example.com"/></div>
        <div class="field" style="margin-bottom:8px"><label>Password</label>
          <input class="input" id="auth-pass" type="password" autocomplete="current-password" placeholder="At least 6 characters"/></div>
        <div id="auth-msg" class="hint" style="min-height:18px"></div>
      </div>
      <div class="modal-foot" style="flex-direction:column;gap:8px">
        <button class="btn btn-primary btn-block" data-action="auth-signin">Sign in</button>
        <button class="btn btn-block" data-action="auth-signup">Create account</button>
      </div>
    </div></div>`);
  const em = document.getElementById("auth-email"); if (em) em.focus();
}
function authMsg(m, ok) {
  const el = document.getElementById("auth-msg");
  if (el) { el.textContent = m; el.style.color = ok ? "var(--good-ink)" : "var(--over-ink)"; }
}
async function doAuth(mode) {
  if (!sb) return;
  const email = ((document.getElementById("auth-email")||{}).value || "").trim();
  const pass = (document.getElementById("auth-pass")||{}).value || "";
  if (!email || !pass) { authMsg("Enter your email and password."); return; }
  authMsg(mode === "signup" ? "Creating account…" : "Signing in…", true);
  try {
    if (mode === "signup") {
      const { data, error } = await sb.auth.signUp({ email, password: pass });
      if (error) { authMsg(error.message); return; }
      if (data.session) { authUser = data.session.user; unmountModal(); toast("Account created"); updateSyncUI(); await pullCloud(true); }
      else { authMsg("Account created. Check your email to confirm, then sign in.", true); }
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) { authMsg(error.message); return; }
      authUser = data.user; unmountModal(); toast("Signed in"); updateSyncUI(); await pullCloud(true);
    }
  } catch (e) { authMsg("Something went wrong — please try again."); }
}
async function doSignOut() {
  if (!sb) return;
  try { await sb.auth.signOut(); } catch (e) {}
  authUser = null; setSync("offline"); unmountModal(); toast("Signed out");
}
async function syncNow() {
  if (!authUser) return;
  await pushCloud(); await pullCloud(false); toast("Synced");
}

/* =========================================================================
   INIT
   ========================================================================= */
applyTheme();
render();
initAuth();

// Re-render charts at the right size only when crossing the mobile/desktop breakpoint
// (width-based, so mobile scroll that toggles the URL bar — a height change — never triggers it)
let lastMobileBP = window.innerWidth <= 760;
window.addEventListener("resize", () => {
  const m = window.innerWidth <= 760;
  if (m !== lastMobileBP) { lastMobileBP = m; if (!modalRoot) render(); }
});
</script>
